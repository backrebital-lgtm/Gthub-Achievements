name: Hourly maintenance
on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, assigned, unassigned]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, review_requested, review_request_removed]
  # Review submit/dismiss is a separate event; pull_request_target does not include it.
  # GITHUB_REF for this event is the PR merge branch, so checkout must stay on the default branch.
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview assignments and review requests without writing'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hourly-maintenance
  cancel-in-progress: false
jobs:
  coordinate:
    if: >
      github.repository == 'ramincsy/Gthub-Achievements' &&
      (github.event_name != 'pull_request_review' ||
       (github.event.review.state != 'commented' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Privileged coordinator: never check out or execute PR-controlled code.
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Check docs, config and workflows
        run: npm run check
      - name: Update work summary when state changes
        run: node scripts/coordinate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
