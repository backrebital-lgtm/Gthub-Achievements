name: Hourly maintenance
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hourly-maintenance
  cancel-in-progress: false
jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --test
      - run: node scripts/check.mjs
      - name: Update work summary when state changes
        run: node scripts/coordinate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
