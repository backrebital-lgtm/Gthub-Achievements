name: کار مشخص پروژه
description: یک اصلاح، مثال یا قابلیت قابل بررسی
title: "[Task] "
body:
  - type: textarea
    id: problem
    attributes:
      label: مسئله
      description: چه چیزی باید بهتر شود؟
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: معیار پایان
      description: با چه بررسی‌ای می‌فهمیم کار تمام شده است؟
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: حوزه
      description: موضوع کار برای برچسب‌گذاری دستی نگهدارنده.
      options:
        - area:docs
        - area:automation
        - area:tests
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: اولویت پیشنهادی
      options:
        - priority:normal
        - priority:high
    validations:
      required: true
